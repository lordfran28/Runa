# Keeps data/index.json, the list of entries, in step with the locked files in data/. A device that adds or
# changes an entry already brings the list up to date itself; this catches anything else (an entry added
# from here, or a list update that didn't go through).
name: Entries
on:
  push:
    branches: [main]
    paths: ["data/*.locked"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entries
  cancel-in-progress: false
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/data_index.py
      - run: |
          git diff --quiet data/index.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update the list of entries"
          git pull --rebase origin main
          git push
